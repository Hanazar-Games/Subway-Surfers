<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Subway Surfers</title>
  <link rel="stylesheet" href="./webgl.css" type="text/css">
  <style>
    /* ========== SPLASH SCREEN ========== */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #050508;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      animation: splash-fadeout 0.45s cubic-bezier(0.65, 0, 0.35, 1) 2.5s forwards;
    }

    /* 动态粒子背景 */
    #splash-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 80%, rgba(255, 0, 85, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(0, 255, 200, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255, 170, 0, 0.04) 0%, transparent 60%);
      animation: bg-pulse 2.5s ease-in-out infinite;
    }

    @keyframes bg-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* 3D 地铁轨道透视 */
    .track-container {
      position: absolute;
      width: 100%;
      height: 100%;
      perspective: 400px;
      overflow: hidden;
      pointer-events: none;
    }

    .track-lines {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 600px;
      height: 600px;
      transform: translateX(-50%) rotateX(60deg);
      transform-style: preserve-3d;
    }

    .track-line {
      position: absolute;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0) 100%);
      width: 2px;
      height: 0;
      top: 0;
      animation: track-grow 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .track-line:nth-child(1) { left: 30%; animation-delay: 0.05s; }
    .track-line:nth-child(2) { left: 50%; animation-delay: 0.1s; width: 3px; background: linear-gradient(to bottom, rgba(255, 0, 85, 0) 0%, rgba(255, 0, 85, 0.4) 50%, rgba(255, 0, 85, 0) 100%); }
    .track-line:nth-child(3) { left: 70%; animation-delay: 0.15s; }
    .track-line:nth-child(4) { left: 10%; animation-delay: 0.2s; opacity: 0.4; }
    .track-line:nth-child(5) { left: 90%; animation-delay: 0.25s; opacity: 0.4; }

    @keyframes track-grow {
      0% { height: 0; opacity: 0; }
      30% { opacity: 1; }
      100% { height: 100%; opacity: 0.7; }
    }

    /* 横向轨道枕木 */
    .sleepers {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 600px;
      height: 600px;
      transform: translateX(-50%) rotateX(60deg);
    }

    .sleeper {
      position: absolute;
      left: 20%;
      right: 20%;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      transform: scaleX(0);
      animation: sleeper-appear 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .sleeper:nth-child(1) { top: 15%; animation-delay: 0.3s; }
    .sleeper:nth-child(2) { top: 30%; animation-delay: 0.45s; }
    .sleeper:nth-child(3) { top: 45%; animation-delay: 0.6s; }
    .sleeper:nth-child(4) { top: 60%; animation-delay: 0.75s; }
    .sleeper:nth-child(5) { top: 75%; animation-delay: 0.9s; }

    @keyframes sleeper-appear {
      0% { transform: scaleX(0); opacity: 0; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    /* 标题区域 */
    .splash-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Hanazar Products */
    .splash-studio {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #8899aa;
      opacity: 0;
      animation: studio-fadein 0.6s ease-out 0.4s forwards;
      position: relative;
    }

    .splash-studio::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #ff0055, transparent);
      animation: line-expand 0.5s ease-out 0.8s forwards;
    }

    @keyframes studio-fadein {
      0% { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes line-expand {
      0% { left: 50%; width: 0; }
      100% { left: 5%; width: 90%; }
    }

    /* Subway Surfers 主标题 */
    .splash-title {
      position: relative;
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      transform: scale(0.85) translateZ(-200px);
      animation: title-zoom 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
      text-shadow:
        0 0 10px rgba(255, 0, 85, 0.5),
        0 0 30px rgba(255, 0, 85, 0.3),
        0 0 60px rgba(255, 0, 85, 0.2);
    }

    .splash-title .letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(20px) rotateX(-40deg);
      animation: letter-pop 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 霓虹闪烁层 */
    .splash-title-neon {
      position: absolute;
      inset: 0;
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: transparent;
      opacity: 0;
      animation: neon-blink 1.2s ease-in-out 1.1s forwards, flicker 0.1s ease-in-out 1.4s 3;
      -webkit-text-stroke: 1px rgba(255, 0, 85, 0.6);
      text-shadow:
        0 0 5px #ff0055,
        0 0 15px #ff0055,
        0 0 30px #ff0055,
        0 0 60px #ff0055;
      pointer-events: none;
    }

    @keyframes title-zoom {
      0% { opacity: 0; transform: scale(0.85) translateZ(-200px); }
      100% { opacity: 1; transform: scale(1) translateZ(0); }
    }

    @keyframes letter-pop {
      0% { opacity: 0; transform: translateY(20px) rotateX(-40deg); }
      100% { opacity: 1; transform: translateY(0) rotateX(0); }
    }

    @keyframes neon-blink {
      0% { opacity: 0; }
      20% { opacity: 0.8; }
      40% { opacity: 0.2; }
      60% { opacity: 0.9; }
      80% { opacity: 0.4; }
      100% { opacity: 0.6; }
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.2; }
    }

    /* 底部进度条 */
    .splash-progress-wrapper {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: progress-fadein 0.3s ease-out 0.5s forwards;
    }

    .splash-progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #ff5500, #ffcc00);
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.5), 0 0 20px rgba(255, 85, 0, 0.3);
      animation: progress-fill 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    }

    /* 扫光效果 */
    .splash-progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: light-sweep 1.5s ease-in-out 0.6s forwards;
    }

    .splash-progress-text {
      position: absolute;
      bottom: calc(18% - 22px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.4);
      opacity: 0;
      animation: progress-fadein 0.3s ease-out 0.5s forwards;
    }

    @keyframes progress-fadein {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes progress-fill {
      0% { width: 0; }
      100% { width: 100%; }
    }

    @keyframes light-sweep {
      0% { left: -50%; }
      100% { left: 150%; }
    }

    /* 整体淡出 */
    @keyframes splash-fadeout {
      0% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* 提示文字 */
    .splash-hint {
      position: absolute;
      bottom: 8%;
      font-size: 10px;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.2);
      opacity: 0;
      animation: hint-fade 0.5s ease-out 1.8s forwards;
    }

    @keyframes hint-fade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Glitch 遮罩层 - 结束时 */
    .glitch-overlay {
      position: absolute;
      inset: 0;
      background: #ff0055;
      opacity: 0;
      mix-blend-mode: overlay;
      pointer-events: none;
      animation: glitch-flash 0.08s ease-out 2.45s forwards;
    }

    @keyframes glitch-flash {
      0% { opacity: 0; }
      50% { opacity: 0.15; }
      100% { opacity: 0; }
    }
  </style>
</head>

<body>
  <!-- ===== 开场动画 ===== -->
  <div id="splash-screen">
    <div class="track-container">
      <div class="track-lines">
        <div class="track-line"></div>
        <div class="track-line"></div>
        <div class="track-line"></div>
        <div class="track-line"></div>
        <div class="track-line"></div>
      </div>
      <div class="sleepers">
        <div class="sleeper"></div>
        <div class="sleeper"></div>
        <div class="sleeper"></div>
        <div class="sleeper"></div>
        <div class="sleeper"></div>
      </div>
    </div>

    <div class="splash-content">
      <div class="splash-studio">Hanazar Products</div>
      <div class="splash-title" id="splash-title">
        Subway Surfers
        <div class="splash-title-neon" id="splash-title-neon">Subway Surfers</div>
      </div>
    </div>

    <div class="splash-progress-wrapper">
      <div class="splash-progress-bar"></div>
    </div>
    <div class="splash-progress-text">LOADING</div>

    <div class="splash-hint">PRESS ANY KEY TO START</div>

    <div class="glitch-overlay"></div>
  </div>

  <!-- ===== 游戏主体 ===== -->
  <div id="wrapper" align="center" style="margin-left:auto; margin-right:auto;">
    <h1 id="heading"
      style="background-color: #a59e9a; text-decoration-style: solid; color: #F8F8F8; width: 40%; margin-top: 0px; margin-bottom: 10px; text-align: center;">
      Subway Surfers</h1>
    <div id="maze">
      <div id="c"
        style="margin-left:auto; margin-right:auto;margin-bottom: 10px;text-align: center;width: 10%;font-size: large">
      </div>

      <canvas id="glcanvas" width="1280" height="720" style="margin-left:auto; margin-right:auto">This text is displayed
        if your browser does not support HTML5 Canvas.</canvas>
      <div id="timerel"
        style="margin-left:auto; margin-right:auto;margin-top:0px;text-align: center;width: 15%;font-size: large"></div>
      <div>
        <audio src='./assets/Theme.mp3' id="music" loop></audio>
        <audio src='./assets/Crash.mp3' id="crash"></audio>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // 拆分标题字母，逐个弹出动画
      const title = document.getElementById('splash-title');
      const neon = document.getElementById('splash-title-neon');
      const text = 'Subway Surfers';
      let html = '';
      let neonHtml = '';
      for (let i = 0; i < text.length; i++) {
        var ch = text.charAt(i);
        var displayCh = ch === ' ' ? '\u00A0' : ch;
        var delay = 0.75 + i * 0.04;
        html += '<span class="letter" style="animation-delay:' + delay + 's">' + displayCh + '<\/span>';
        neonHtml += '<span class="letter" style="animation-delay:' + delay + 's">' + displayCh + '<\/span>';
      }
      // 清空原有文本节点并插入新结构
      var nodes = title.childNodes;
      for (var k = nodes.length - 1; k >= 0; k--) {
        if (nodes[k].nodeType === 3) title.removeChild(nodes[k]);
      }
      title.insertAdjacentHTML('afterbegin', html);
      neon.innerHTML = neonHtml;

      // 进度条百分比数字跳动
      var pctEl = document.querySelector('.splash-progress-text');
      var start = Date.now();
      var duration = 1800;
      function tick() {
        var elapsed = Date.now() - start;
        var p = Math.min(100, Math.floor((elapsed / duration) * 100));
        if (pctEl) pctEl.textContent = 'LOADING ' + p + '%';
        if (elapsed < duration) requestAnimationFrame(tick);
        else if (pctEl) pctEl.textContent = 'LOADING 100%';
      }
      setTimeout(tick, 500);
    })();

    // 2.5s 后彻底移除 splash，释放资源
    setTimeout(function () {
      var splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.display = 'none';
        splash.innerHTML = '';
      }
    }, 3000);
  </script>

  <script src="./gl-matrix.js"></script>
  <script src="./cube.js"></script>
  <script src="./track.js"></script>
  <script src="./wall.js"></script>
  <script src="./city.js"></script>
  <script src="./handlekeys.js"></script>
  <script src="./player.js"></script>
  <script src="./police.js"></script>
  <script src="./dog.js"></script>
  <script src="./coin.js"></script>
  <script src="./train.js"></script>
  <script src="./box.js"></script>
  <script src="./manhole.js"></script>
  <script src="./stop.js"></script>
  <script src="./stand.js"></script>
  <script src="./boots.js"></script>
  <script src="./flying_boost.js"></script>
  <script src="./hoverboard.js"></script>
  <script src="./main.js"></script>
</body>

</html>
